<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receptjes Moutstraat</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #F4F1EC;
            --surface: #FFFFFF;
            --header-bg: #1A1A1A;
            --accent: #FF6B35;
            --text: #1C1C1E;
            --text-muted: #6E6E73;
            --shadow: 0 2px 16px rgba(0,0,0,0.07);
            --shadow-hover: 0 10px 36px rgba(0,0,0,0.16);
            --radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ─────────────────── HERO ─────────────────── */
        #hero {
            background: #111111;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px 48px;
            gap: 36px;
            position: relative;
        }

        .hero-text {
            text-align: center;
        }
        .hero-text h1 {
            color: #fff;
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.15;
        }
        .hero-text h1 span { color: var(--accent); }
        .hero-text p {
            color: rgba(255,255,255,0.45);
            font-size: 1rem;
            margin-top: 8px;
        }

        /* Hero search */
        .hero-search {
            width: 100%;
            max-width: 480px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .hero-search svg {
            position: absolute;
            left: 16px;
            color: rgba(255,255,255,0.35);
            pointer-events: none;
        }
        #heroSearchInput {
            width: 100%;
            padding: 14px 18px 14px 48px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: background 0.2s, border-color 0.2s;
        }
        #heroSearchInput::placeholder { color: rgba(255,255,255,0.3); }
        #heroSearchInput:focus {
            background: rgba(255,255,255,0.13);
            border-color: var(--accent);
        }

        /* Type tiles */
        .hero-section-label {
            color: rgba(255,255,255,0.35);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            text-align: center;
            margin-bottom: -20px;
            width: 100%;
            max-width: 700px;
        }

        #type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 700px;
        }

        .type-tile {
            background: #1E1E1E;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px 12px 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            transition: transform 0.18s, border-color 0.18s, background 0.18s;
            user-select: none;
        }
        .type-tile:hover {
            transform: translateY(-3px);
            border-color: rgba(255,107,53,0.5);
            background: #242424;
        }
        .type-tile.selected {
            border-color: var(--accent);
            background: rgba(255,107,53,0.12);
        }
        .type-tile.selected .tile-name { color: var(--accent); }
        .type-tile .tile-emoji {
            font-size: 2rem;
            line-height: 1;
        }
        .type-tile .tile-name {
            color: rgba(255,255,255,0.85);
            font-size: 0.82rem;
            font-weight: 600;
        }
        .type-tile .tile-count {
            color: rgba(255,255,255,0.3);
            font-size: 0.7rem;
        }

        /* Protein tiles */
        #protein-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 700px;
        }

        /* Cuisine row — wrapping, no sideways scroll */
        #cuisine-row {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cuisine-pill {
            background: #1E1E1E;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: border-color 0.15s, background 0.15s, transform 0.15s;
            user-select: none;
        }
        .cuisine-pill:hover {
            border-color: rgba(255,107,53,0.5);
            background: #242424;
            transform: translateY(-1px);
        }
        .cuisine-pill.selected {
            border-color: var(--accent);
            background: rgba(255,107,53,0.12);
        }
        .cuisine-pill.selected .cuisine-name { color: var(--accent); }
        .cuisine-pill .cuisine-flag { font-size: 1.1rem; }
        .cuisine-pill .cuisine-name {
            color: rgba(255,255,255,0.75);
            font-size: 0.8rem;
            font-weight: 500;
        }
        .cuisine-pill .cuisine-count {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
            border-radius: 10px;
            padding: 0 6px;
            font-size: 0.68rem;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }

        /* Browse all button */
        #browse-all-btn {
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.55);
            padding: 10px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #browse-all-btn:hover {
            border-color: rgba(255,255,255,0.4);
            color: white;
        }
        #browse-all-btn svg { transition: transform 0.15s; }
        #browse-all-btn:hover svg { transform: translateY(3px); }

        /* ─────────────────── STICKY HEADER ─────────────────── */
        #sticky-top {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #header {
            background: var(--header-bg);
            display: flex;
            align-items: center;
            padding: 0 20px;
            height: 50px;
            gap: 12px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.35);
        }

        .site-title {
            color: white;
            font-size: 0.92rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            text-decoration: none;
        }
        .site-title:hover { color: white; }
        .site-title span { color: var(--accent); }

        /* Search box — icon + input + count pill all in one capsule */
        .search-wrap {
            flex: 1;
            max-width: 460px;
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-wrap svg {
            position: absolute;
            left: 12px;
            color: rgba(255,255,255,0.38);
            pointer-events: none;
            flex-shrink: 0;
        }
        #searchInput {
            width: 100%;
            padding: 7px 52px 7px 36px;
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 8px;
            color: white;
            font-size: 0.85rem;
            outline: none;
            transition: background 0.2s, border-color 0.2s;
        }
        #searchInput::placeholder { color: rgba(255,255,255,0.3); }
        #searchInput:focus { background: rgba(255,255,255,0.13); border-color: var(--accent); }

        #recipe-count {
            position: absolute;
            right: 10px;
            color: rgba(255,255,255,0.35);
            font-size: 0.72rem;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Filter button */
        #filterBtn {
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.13);
            color: white;
            padding: 6px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
            margin-left: auto;
        }
        #filterBtn:hover { background: rgba(255,255,255,0.15); }
        #filterBtn.active { background: var(--accent); border-color: var(--accent); }
        #filterBadge {
            background: white;
            color: var(--accent);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 0.64rem;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* ── Filter Panel — 2-column grid, no sideways scroll ── */
        #filterPanel {
            background: #1E1E1E;
            border-top: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s ease;
        }
        #filterPanel.open { max-height: 600px; overflow-y: auto; }

        .filter-panel-inner {
            padding: 18px 20px 4px;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 20px 32px;
            align-items: start;
        }
        .filter-col { display: flex; flex-direction: column; gap: 16px; }

        .filter-category h3 {
            color: rgba(255,255,255,0.38);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }
        .filter-chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .filter-option {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.65);
            border-radius: 20px;
            padding: 4px 11px;
            font-size: 0.77rem;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .filter-option:hover { background: rgba(255,255,255,0.12); color: white; }
        .filter-option.active { background: var(--accent); border-color: var(--accent); color: white; }

        .filter-panel-footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 10px 20px;
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
        }
        #clearFilters {
            background: none;
            border: 1px solid rgba(255,255,255,0.16);
            color: rgba(255,255,255,0.45);
            padding: 4px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: all 0.15s;
        }
        #clearFilters:hover { border-color: rgba(255,255,255,0.38); color: white; }

        /* ── Active filter chips bar ── */
        #activeFiltersBar {
            background: var(--header-bg);
            border-top: 1px solid rgba(255,255,255,0.07);
            display: none;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
            padding: 8px 24px;
        }
        #activeFiltersBar.visible { display: flex; }
        .af-label { color: rgba(255,255,255,0.35); font-size: 0.73rem; font-weight: 600; margin-right: 2px; }
        .active-filter-chip {
            background: rgba(255,107,53,0.2);
            border: 1px solid rgba(255,107,53,0.45);
            color: #FF8C65;
            border-radius: 20px;
            padding: 3px 4px 3px 10px;
            font-size: 0.76rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .active-filter-chip button {
            background: rgba(255,255,255,0.12);
            border: none;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            font-size: 0.85rem;
            line-height: 1;
            padding: 1px 5px;
            border-radius: 50%;
            transition: background 0.15s;
        }
        .active-filter-chip button:hover { background: rgba(255,255,255,0.28); color: white; }

        /* ─────────────────── RECIPE SECTION ─────────────────── */
        #recipes-section { background: var(--bg); }

        #main {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 24px;
            max-width: 1800px;
            margin: 0 auto;
        }

        /* ── Recipe cards ── */
        .recipe-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .recipe-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); }

        .card-image-wrap {
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
            background: #E8E4DE;
        }
        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
            display: block;
        }
        .recipe-card:hover .card-image-wrap img { transform: scale(1.07); }

        .card-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: linear-gradient(135deg, #EDE8E0, #D4CEC5);
        }

        /* Card image overlay — cuisine left, protein right */
        .card-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, transparent 100%);
            padding: 28px 10px 9px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 4px;
        }
        .card-tag {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            border-radius: 7px;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .card-tag.protein { background: rgba(255,107,53,0.55); }

        .card-body { padding: 13px 15px 15px; }
        .card-title {
            font-size: 0.93rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }

        /* ── No results ── */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .no-results .icon { font-size: 2.8rem; margin-bottom: 14px; }
        .no-results h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--text); }
        .no-results p { font-size: 0.88rem; }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            #type-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
            .type-tile { padding: 14px 6px 12px; }
            .type-tile .tile-emoji { font-size: 1.6rem; }
            .type-tile .tile-name { font-size: 0.73rem; }
            .type-tile .tile-count { display: none; }

            #header { padding: 0 14px; gap: 10px; }
            .site-title { display: none; }
            #recipe-count { display: none; }

            #main { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; padding: 14px; }
            .card-body { padding: 10px 12px 13px; }
            .card-title { font-size: 0.86rem; }
        }

        @media (max-width: 380px) {
            #type-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

<!-- ─── HERO / ENTRY SCREEN ─── -->
<section id="hero">
    <div class="hero-text">
        <h1>Receptjes <span>Moutstraat</span></h1>
        <p>What are you in the mood for?</p>
    </div>

    <div class="hero-search">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="heroSearchInput" placeholder="Search by name or ingredient…">
    </div>

    <div style="width:100%;max-width:700px;">
        <div class="hero-section-label" style="margin-bottom:12px;">Category</div>
        <div id="type-grid">
            <div class="type-tile" data-type="Meal">
                <span class="tile-emoji">🍽️</span>
                <span class="tile-name">Meal</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-type="Side">
                <span class="tile-emoji">🥗</span>
                <span class="tile-name">Side</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-type="Soup">
                <span class="tile-emoji">🍲</span>
                <span class="tile-name">Soup</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-type="Bread">
                <span class="tile-emoji">🍞</span>
                <span class="tile-name">Bread</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-type="Dessert">
                <span class="tile-emoji">🍰</span>
                <span class="tile-name">Dessert</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-type="Drink">
                <span class="tile-emoji">🍹</span>
                <span class="tile-name">Drink</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-type="Sauce">
                <span class="tile-emoji">🥫</span>
                <span class="tile-name">Sauce</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-type="Other">
                <span class="tile-emoji">🫙</span>
                <span class="tile-name">Other</span>
                <span class="tile-count">—</span>
            </div>
        </div>
    </div>

    <div style="width:100%;max-width:700px;">
        <div class="hero-section-label" style="margin-bottom:12px;">Protein</div>
        <div id="protein-grid">
            <div class="type-tile" data-protein="Meat">
                <span class="tile-emoji">🥩</span>
                <span class="tile-name">Meat</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-protein="Seafood">
                <span class="tile-emoji">🦐</span>
                <span class="tile-name">Seafood</span>
                <span class="tile-count">—</span>
            </div>
            <div class="type-tile" data-protein="Veggy">
                <span class="tile-emoji">🥬</span>
                <span class="tile-name">Vegetarian</span>
                <span class="tile-count">—</span>
            </div>
        </div>
    </div>

    <button id="browse-all-btn">
        Browse all recipes
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12l7 7 7-7"/>
        </svg>
    </button>
</section>

<!-- ─── RECIPE SECTION ─── -->
<div id="recipes-section">
    <div id="sticky-top">
        <header id="header">
            <a class="site-title" href="#hero">🍳 <span>Moutstraat</span></a>

            <div class="search-wrap">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Search recipes…">
                <span id="recipe-count"></span>
            </div>

            <button id="filterBtn">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <line x1="4" y1="6" x2="20" y2="6"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                    <line x1="11" y1="18" x2="13" y2="18"/>
                </svg>
                Filter
                <span id="filterBadge">0</span>
            </button>
        </header>

        <div id="filterPanel">
            <div class="filter-panel-inner">
                <!-- Left column: Type + Protein -->
                <div class="filter-col">
                    <div class="filter-category">
                        <h3>Type</h3>
                        <div class="filter-chips">
                            <button class="filter-option" data-category="Type" data-value="Meal">🍽️ Meal</button>
                            <button class="filter-option" data-category="Type" data-value="Side">🥗 Side</button>
                            <button class="filter-option" data-category="Type" data-value="Soup">🍲 Soup</button>
                            <button class="filter-option" data-category="Type" data-value="Bread">🍞 Bread</button>
                            <button class="filter-option" data-category="Type" data-value="Dessert">🍰 Dessert</button>
                            <button class="filter-option" data-category="Type" data-value="Drink">🍹 Drink</button>
                            <button class="filter-option" data-category="Type" data-value="Sauce">🥫 Sauce</button>
                            <button class="filter-option" data-category="Type" data-value="Other">🫙 Other</button>
                        </div>
                    </div>
                    <div class="filter-category">
                        <h3>Protein</h3>
                        <div class="filter-chips">
                            <button class="filter-option" data-category="Protein" data-value="Pork">🥓 Pork</button>
                            <button class="filter-option" data-category="Protein" data-value="Beef">🥩 Beef</button>
                            <button class="filter-option" data-category="Protein" data-value="Chicken">🍗 Chicken</button>
                            <button class="filter-option" data-category="Protein" data-value="Mince">🍖 Mince</button>
                            <button class="filter-option" data-category="Protein" data-value="Sausage">🌭 Sausage</button>
                            <button class="filter-option" data-category="Protein" data-value="Seafood">🦐 Seafood</button>
                            <button class="filter-option" data-category="Protein" data-value="Veggy">🥬 Vegetarian</button>
                        </div>
                    </div>
                </div>
                <!-- Right column: Cuisine (wraps freely) -->
                <div class="filter-col">
                    <div class="filter-category">
                        <h3>Cuisine</h3>
                        <div class="filter-chips">
                            <button class="filter-option" data-category="Cuisine" data-value="Japanese">🇯🇵 Japanese</button>
                            <button class="filter-option" data-category="Cuisine" data-value="American">🇺🇸 American</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Chinese">🇨🇳 Chinese</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Korean">🇰🇷 Korean</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Belgian">🇧🇪 Belgian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Italian">🇮🇹 Italian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Greek">🇬🇷 Greek</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Albanian">🇦🇱 Albanian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Turkish">🇹🇷 Turkish</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Argentinian">🇦🇷 Argentinian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="English">🇬🇧 English</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Vietnamese">🇻🇳 Vietnamese</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Surinamese">🇸🇷 Surinamese</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Thai">🇹🇭 Thai</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Mongolian">🇲🇳 Mongolian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="French">🇫🇷 French</button>
                            <button class="filter-option" data-category="Cuisine" data-value="German">🇩🇪 German</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Georgian">🇬🇪 Georgian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Indian">🇮🇳 Indian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Laotian">🇱🇦 Laotian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Malaysian">🇲🇾 Malaysian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Mexican">🇲🇽 Mexican</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Russian">🇷🇺 Russian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Polish">🇵🇱 Polish</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Indonesian">🇮🇩 Indonesian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Austrian">🇦🇹 Austrian</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Taiwanese">🇹🇼 Taiwanese</button>
                            <button class="filter-option" data-category="Cuisine" data-value="Spanish">🇪🇸 Spanish</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-panel-footer">
                <button id="clearFilters">Clear all filters</button>
            </div>
        </div>

        <div id="activeFiltersBar"></div>
    </div>

    <div id="main"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const main = document.getElementById("main");
    const searchInput = document.getElementById("searchInput");
    const heroSearchInput = document.getElementById("heroSearchInput");
    const filterBtn = document.getElementById("filterBtn");
    const filterPanel = document.getElementById("filterPanel");
    const filterOptions = document.querySelectorAll(".filter-option");
    const clearFiltersBtn = document.getElementById("clearFilters");
    const recipeCount = document.getElementById("recipe-count");
    const activeFiltersBar = document.getElementById("activeFiltersBar");
    const filterBadge = document.getElementById("filterBadge");

    let activeFilters = new Map();
    let allRecipes = {};

    const typeEmojis = { Meal:'🍽️', Side:'🥗', Soup:'🍲', Bread:'🍞', Dessert:'🍰', Drink:'🍹', Sauce:'🥫', Other:'🫙' };
    const proteinEmojis = { Pork:'🥓', Beef:'🥩', Chicken:'🍗', Mince:'🍖', Sausage:'🌭', Seafood:'🦐', Veggy:'🥬' };
    const meatTypes = ['Pork', 'Beef', 'Chicken', 'Mince', 'Sausage'];
    const cuisineFlags = {
        Japanese:'🇯🇵', American:'🇺🇸', Chinese:'🇨🇳', Korean:'🇰🇷', Belgian:'🇧🇪',
        Italian:'🇮🇹', Greek:'🇬🇷', Albanian:'🇦🇱', Turkish:'🇹🇷', Argentinian:'🇦🇷',
        English:'🇬🇧', Vietnamese:'🇻🇳', Surinamese:'🇸🇷', Thai:'🇹🇭', Mongolian:'🇲🇳',
        French:'🇫🇷', German:'🇩🇪', Georgian:'🇬🇪', Indian:'🇮🇳', Laotian:'🇱🇦',
        Malaysian:'🇲🇾', Mexican:'🇲🇽', Russian:'🇷🇺', Polish:'🇵🇱', Indonesian:'🇮🇩',
        Austrian:'🇦🇹', Taiwanese:'🇹🇼', Spanish:'🇪🇸'
    };
    const typeValues = Object.keys(typeEmojis);
    const cuisineValues = Object.keys(cuisineFlags);
    const proteinValues = ['Pork','Beef','Chicken','Mince','Sausage','Seafood','Veggy'];

    // ── Load recipes ──
    try {
        const response = await fetch("recipe_metadata.json");
        if (!response.ok) throw new Error("Failed to fetch recipe metadata");
        allRecipes = await response.json();
        renderRecipes(allRecipes);
        populateHeroCounts();
    } catch (error) {
        main.innerHTML = `<div class="no-results"><div class="icon">⚠️</div><h2>Failed to load recipes</h2><p>Please try refreshing the page.</p></div>`;
        console.error(error);
    }

    function populateHeroCounts() {
        // Type tiles
        document.querySelectorAll('[data-type]').forEach(tile => {
            const count = Object.values(allRecipes).filter(r => r.category?.includes(tile.dataset.type)).length;
            tile.querySelector('.tile-count').textContent = count + ' recipes';
        });
        // Protein tiles
        // Only count savory types for protein tiles — desserts/drinks/etc. skew the numbers
        const savoryTypes = ['Meal', 'Side', 'Soup', 'Bread', 'Sauce'];
        const savory = Object.values(allRecipes).filter(r => savoryTypes.some(t => r.category?.includes(t)));
        const meatCount = savory.filter(r => meatTypes.some(m => r.category?.includes(m))).length;
        const seafoodCount = savory.filter(r => r.category?.includes('Seafood')).length;
        const veggyCount = savory.filter(r => ![...meatTypes, 'Seafood'].some(m => r.category?.includes(m))).length;
        document.querySelector('[data-protein="Meat"] .tile-count').textContent = meatCount + ' recipes';
        document.querySelector('[data-protein="Seafood"] .tile-count').textContent = seafoodCount + ' recipes';
        document.querySelector('[data-protein="Veggy"] .tile-count').textContent = veggyCount + ' recipes';
        // Cuisine pills — hide if count is 0
        document.querySelectorAll('.cuisine-pill').forEach(pill => {
            const count = Object.values(allRecipes).filter(r => r.category?.includes(pill.dataset.cuisine)).length;
            if (count === 0) pill.style.display = 'none';
            else pill.querySelector('.cuisine-count').textContent = count;
        });
    }

    // ── Hero: type tile clicks ──
    document.querySelectorAll('[data-type]').forEach(tile => {
        tile.addEventListener('click', () => {
            activateFilter('Type', tile.dataset.type);
            scrollToRecipes();
        });
    });

    // ── Hero: protein tile clicks ──
    document.querySelectorAll('[data-protein]').forEach(tile => {
        tile.addEventListener('click', () => {
            activateFilter('Protein', tile.dataset.protein);
            scrollToRecipes();
        });
    });

    // ── Hero: cuisine pill clicks ──
    document.querySelectorAll('.cuisine-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            activateFilter('Cuisine', pill.dataset.cuisine);
            scrollToRecipes();
        });
    });

    // ── Hero: search ──
    heroSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && heroSearchInput.value.trim()) {
            searchInput.value = heroSearchInput.value.trim();
            scrollToRecipes();
            applySearchAndFilters();
        }
    });
    heroSearchInput.addEventListener('input', () => {
        if (heroSearchInput.value.trim()) {
            searchInput.value = heroSearchInput.value;
            applySearchAndFilters();
        }
    });

    // ── Browse all ──
    document.getElementById('browse-all-btn').addEventListener('click', scrollToRecipes);

    function scrollToRecipes() {
        document.getElementById('recipes-section').scrollIntoView({ behavior: 'smooth' });
    }

    // Radio-button style: clicking a hero tile replaces the existing selection
    // for that category. Clicking the same value again deselects it.
    function activateFilter(category, value) {
        const alreadySelected = activeFilters.get(category)?.has(value) && activeFilters.get(category).size === 1;

        // Always clear the whole category first
        activeFilters.delete(category);
        filterOptions.forEach(btn => {
            if (btn.dataset.category === category) btn.classList.remove('active');
        });

        if (!alreadySelected) {
            activeFilters.set(category, new Set([value]));
            filterOptions.forEach(btn => {
                if (btn.dataset.category === category && btn.dataset.value === value)
                    btn.classList.add('active');
            });
        }

        syncHeroTileStates();
        updateActiveFiltersBar();
        applySearchAndFilters();
    }

    function syncHeroTileStates() {
        document.querySelectorAll('[data-type]').forEach(tile => {
            tile.classList.toggle('selected', !!activeFilters.get('Type')?.has(tile.dataset.type));
        });
        document.querySelectorAll('[data-protein]').forEach(tile => {
            tile.classList.toggle('selected', !!activeFilters.get('Protein')?.has(tile.dataset.protein));
        });
        document.querySelectorAll('.cuisine-pill').forEach(pill => {
            pill.classList.toggle('selected', !!activeFilters.get('Cuisine')?.has(pill.dataset.cuisine));
        });
    }

    // ── Filter panel toggle ──
    filterBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = filterPanel.classList.toggle("open");
        filterBtn.classList.toggle("active", open);
    });
    document.addEventListener("click", (e) => {
        if (!filterPanel.contains(e.target) && !filterBtn.contains(e.target)) {
            filterPanel.classList.remove("open");
            filterBtn.classList.remove("active");
        }
    });

    // ── Render ──
    function renderRecipes(filtered) {
        const keys = Object.keys(filtered);
        recipeCount.textContent = `${keys.length} recipe${keys.length !== 1 ? 's' : ''}`;

        if (keys.length === 0) {
            main.innerHTML = `<div class="no-results"><div class="icon">🍽️</div><h2>No recipes found</h2><p>Try adjusting your search or filters.</p></div>`;
            return;
        }

        main.innerHTML = keys.map(file => {
            const { title, category = [] } = filtered[file];
            const imgSrc = `./images/${file.replace('.html', '.jpg')}`;
            const type = typeValues.find(t => category.includes(t));
            const cuisine = cuisineValues.find(c => category.includes(c));
            const protein = proteinValues.find(p => category.includes(p));

            const cuisineTag = cuisine ? `<span class="card-tag">${cuisineFlags[cuisine]} ${cuisine}</span>` : '<span></span>';
            // Only show protein on savory types — no tag on desserts, drinks, or other
            const noProteinTypes = ['Dessert', 'Drink', 'Other'];
            const showProtein = !noProteinTypes.some(t => category.includes(t));
            let proteinTag = '';
            if (showProtein) {
                const proteinLabel = protein
                    ? { emoji: proteinEmojis[protein], name: protein === 'Veggy' ? 'Vegetarian' : protein }
                    : { emoji: '🥬', name: 'Vegetarian' };
                proteinTag = `<span class="card-tag protein">${proteinLabel.emoji} ${proteinLabel.name}</span>`;
            }

            return `
                <a href="${file}" class="recipe-card">
                    <div class="card-image-wrap">
                        <img src="${imgSrc}" alt="${title}" loading="lazy"
                             onerror="this.style.display='none';this.parentElement.querySelector('.card-img-placeholder').style.display='flex'">
                        <div class="card-img-placeholder" style="display:none">${type ? typeEmojis[type] : '🍽️'}</div>
                        <div class="card-overlay">${cuisineTag}${proteinTag}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${title}</div>
                    </div>
                </a>`;
        }).join('');
    }

    function updateActiveFiltersBar() {
        const total = Array.from(activeFilters.values()).reduce((sum, s) => sum + s.size, 0);
        filterBadge.style.display = total > 0 ? 'flex' : 'none';
        filterBadge.textContent = total;

        if (total === 0) {
            activeFiltersBar.classList.remove('visible');
            activeFiltersBar.innerHTML = '';
            return;
        }
        const chips = ['<span class="af-label">Active filters:</span>'];
        activeFilters.forEach((values, category) => {
            values.forEach(value => {
                chips.push(`<div class="active-filter-chip">${value}<button onclick="removeFilter('${category}','${value}')">×</button></div>`);
            });
        });
        activeFiltersBar.innerHTML = chips.join('');
        activeFiltersBar.classList.add('visible');
    }

    window.removeFilter = function(category, value) {
        const set = activeFilters.get(category);
        if (set) { set.delete(value); if (set.size === 0) activeFilters.delete(category); }
        filterOptions.forEach(btn => {
            if (btn.dataset.category === category && btn.dataset.value === value) btn.classList.remove('active');
        });
        syncHeroTileStates();
        updateActiveFiltersBar();
        applySearchAndFilters();
    };

    function applySearchAndFilters() {
        const searchTerm = searchInput.value.toLowerCase().trim();

        let filtered = Object.keys(allRecipes).filter(file => {
            const r = allRecipes[file];
            if (!searchTerm) return true;
            // Search both name and ingredients simultaneously
            return r.title.toLowerCase().includes(searchTerm)
                || r.ingredients?.some(i => i.toLowerCase().includes(searchTerm));
        }).reduce((obj, key) => (obj[key] = allRecipes[key], obj), {});

        if (activeFilters.size > 0) {
            filtered = Object.keys(filtered).filter(file => {
                const data = filtered[file];
                if (!Array.isArray(data.category)) return false;
                return Array.from(activeFilters.entries()).every(([category, values]) =>
                    Array.from(values).some(value => {
                        if (category === 'Protein') {
                            // 'Meat' matches any of the individual meat types
                            if (value === 'Meat') return meatTypes.some(m => data.category.includes(m));
                            // 'Veggy' matches explicit Veggy tag OR recipes with no meat/fish at all
                            if (value === 'Veggy') return data.category.includes('Veggy')
                                || ![...meatTypes, 'Seafood'].some(m => data.category.includes(m));
                        }
                        return data.category.includes(value);
                    })
                );
            }).reduce((obj, key) => (obj[key] = filtered[key], obj), {});
        }
        renderRecipes(filtered);
    }

    searchInput.addEventListener("input", applySearchAndFilters);

    filterOptions.forEach(button => {
        button.addEventListener("click", function() {
            const { category, value } = this.dataset;
            if (!activeFilters.has(category)) activeFilters.set(category, new Set());
            const set = activeFilters.get(category);
            if (set.has(value)) {
                set.delete(value); if (set.size === 0) activeFilters.delete(category);
                this.classList.remove("active");
            } else {
                set.add(value); this.classList.add("active");
            }
            syncHeroTileStates();
            updateActiveFiltersBar();
            applySearchAndFilters();
        });
    });

    clearFiltersBtn.addEventListener("click", () => {
        activeFilters.clear();
        filterOptions.forEach(btn => btn.classList.remove("active"));
        syncHeroTileStates();
        updateActiveFiltersBar();
        applySearchAndFilters();
    });
});
</script>
</body>
</html>
